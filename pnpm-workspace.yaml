packages:
  - "packages/*"
  - "examples/*"

# These packages get their binaries from optional dependencies, so their build scripts are not necessary.
allowBuilds:
  esbuild: false
  sharp: false

catalog:
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  astro: ^7.4.7
  next: ^16.4.5
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest-browser-react: ^2.3.0
  vitest-browser-vue: ^3.1.0
  vue: ^3.5.46
  vue-tsc: ^3.3.14

# rolldown 1.3.0 adds @emnapi/runtime 2.0.0-beta.2, and pnpm pairs it with @emnapi/core 1.11.3.
# The mix breaks the import of @astrojs/check ("this.bridge.deleteEnv is not a function").
overrides:
  "@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime": 1.11.3
