name: Release

on:
  push:
    branches:
      - main
      - next

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      sha: ${{ steps.release-commit.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          # A PR that GITHUB_TOKEN opens starts no workflows. A personal token starts CI on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # A queued run can release a commit other than github.sha. One release PR releases all packages from one commit.
      - name: Find the release commit
        id: release-commit
        if: steps.release.outputs.releases_created == 'true'
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          shas=$(jq -c '[to_entries[] | select(.key | endswith("--sha")) | .value] | unique' <<<"$OUTPUTS")
          if [[ "$(jq length <<<"$shas")" != 1 ]]; then
            echo "::error::Expected one release commit, found $shas"
            exit 1
          fi
          echo "sha=$(jq -r '.[0]' <<<"$shas")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install pnpm, Node.js and the dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          require-lockfile: true

      # The release PR can come from a token that starts no CI, so the publish job checks the packages itself.
      - name: Test package
        run: pnpm test:package

      # The release commit is checked out as a detached HEAD, so pnpm's branch check would fail.
      # pnpm skips the versions that are already on npm, so a re-run publishes only the missing packages.
      # One pnpm call for each package, because a recursive publish stops at the first error, also at a staged 409.
      - name: Publish
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        # A prerelease goes to latest while the package has no stable version, so that a plain install gets it.
        run: |
          set -o pipefail
          # npm stages an accepted version for some minutes, and pnpm view cannot see it. The malware scan of
          # npm can also hold or block a staged version, so a successful publish does not prove the release.
          wait_for_npm() {
            for attempt in {0..40}; do
              if ((attempt)); then sleep 30; fi
              local missing=()
              for spec in "$@"; do
                [[ -n $(pnpm view "$spec" version 2>/dev/null) ]] || missing+=("$spec")
              done
              ((${#missing[@]})) || return 0
              set -- "${missing[@]}"
            done
            echo "::error::$* did not show on npm in 20 minutes. Check it with npm stage list."
            return 1
          }
          # pnpm cannot see a version in the malware scan, so a re-run can publish it again. Match the text: a plain 403 can be OIDC.
          publish() {
            for attempt in {0..3}; do
              if ((attempt)); then sleep $((attempt * 30)); fi
              pnpm --filter "./$path" publish --no-git-checks --tag "$tag" 2>&1 | tee "$RUNNER_TEMP/publish.log" && return 0
              # pnpm wraps its errors at 80 columns with "│".
              local log
              log=$(tr -d '\n│' <"$RUNNER_TEMP/publish.log" | tr -s ' ')
              if [[ $log == *"previously staged version"* || $log == *"cannot publish over the previously published versions: $version."* ]]; then
                echo "::warning::npm already has $name@$version."
                return 0
              fi
              [[ $log =~ status\ 5[0-9]{2} ]] || return 1
            done
            return 1
          }
          published=()
          # The adapters depend on core, so core goes first, and the job waits until core shows on npm.
          for path in $(jq -r 'sort_by(. != "packages/core") | .[]' <<<"$PATHS_RELEASED"); do
            name=$(jq -r .name "$path/package.json")
            version=$(jq -r .version "$path/package.json")
            # Only a missing package counts as "no stable version". Other errors stop the job,
            # so that a registry outage cannot send a prerelease to latest.
            if ! current=$(pnpm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/view.log"); then
              grep -q ERR_PNPM_FETCH_404 "$RUNNER_TEMP/view.log" || { cat "$RUNNER_TEMP/view.log"; exit 1; }
              current=
            fi
            tag=latest
            if [[ $version == *-* && -n $current && $current != *-* ]]; then tag=next; fi
            publish || exit 1
            published+=("$name@$version")
            if [[ $path == packages/core ]]; then wait_for_npm "$name@$version"; fi
          done
          wait_for_npm "${published[@]}"
