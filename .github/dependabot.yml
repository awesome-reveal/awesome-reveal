version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # devEngines.runtime pins Node 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the JS API that vue-tsc, vite-plugin-dts and @astrojs/check use.
      - dependency-name: typescript
        versions: [">=7"]
    # A dependency joins the first group that matches it.
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
      vue:
        patterns:
          - vue
          - "@vue/*"
          - vue-tsc
          - "@vitejs/plugin-vue"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - "vitest-browser-*"
      commitlint:
        patterns:
          - "@commitlint/*"
      oxc:
        patterns:
          - oxlint
          - oxfmt
      # Update the Playwright image tag in ci.yml with each bump.
      playwright:
        patterns:
          - playwright
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
