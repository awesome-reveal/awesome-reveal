version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Point back to main once next is merged into it.
    target-branch: next
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    # A dependency joins the first group that matches it.
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
      vue:
        patterns:
          - vue
          - "@vue/*"
          - vue-tsc
          - "@vitejs/plugin-vue"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - "vitest-browser-*"
